version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/mosaicod"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(mosaicod)"

  - package-ecosystem: "uv"
    directory: "/mosaico-sdk-py"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(sdk-py)"

  - package-ecosystem: "uv"
    directory: "/docs/py"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docs)"

  - package-ecosystem: "npm"
    directory: "/docs/main"
    schedule:
      interval: "weekly"
    # Security updates only: the entry exists to set the commit prefix.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(docs)"

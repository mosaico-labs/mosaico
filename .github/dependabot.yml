version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/mosaicod" 
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(mosaicod)"

  - package-ecosystem: "uv"
    directory: "/mosaico-sdk-py"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(py)"

  - package-ecosystem: "uv"
    directory: "/docs/py"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docs)"

name: Stale Pull Requests

on:
  schedule:
    - cron: "0 1 * * 3" # Every Wednesday at 01:00 UTC
  workflow_dispatch:

# The minimum permissions required to label and comment on pull requests
permissions:
  issues: write
  pull-requests: write

jobs:
  stale-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale pull requests
        uses: actions/stale@v11
        with:
          # Never mark issues as stale
          days-before-issue-stale: -1
          # A pull request is stale after two weeks without updates
          days-before-pr-stale: 14
          # Never close stale pull requests automatically
          days-before-pr-close: -1
          stale-pr-label: "stale"
          stale-pr-message: "This PR has been marked as stale because it has not been updated for two weeks."


name: Python SDK

on:
  push:
    branches: ["main"]
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "scripts/tests"
      - ".github/workflows/py-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**.py"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "scripts/tests"
      - ".github/workflows/py-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: "Static analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: mosaico-sdk-py/uv.lock

      - name: Python SDK Lint
        working-directory: mosaico-sdk-py
        run: |
          uv run --locked --only-group dev ruff format --check .
          uv run --locked --only-group dev ruff check .


  unit-tests:
    name: "Unit tests on (Py ${{ matrix.python-version }})"
    needs: [static-analysis]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-24.04
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: mosaico-sdk-py/uv.lock
      - name: Unit Tests
        run: ./scripts/tests --sdk-python

      - name: Build and smoke-test the distribution
        run: |
          uv build mosaico-sdk-py
          wheels=(mosaico-sdk-py/dist/*.whl)
          uv run --isolated --no-project --with "${wheels[0]}" python -c 'import mosaicolabs'
          uv run --isolated --no-project --with "${wheels[0]}[cli]" mosaico --help
          uv run --isolated --no-project --with "${wheels[0]}[cli]" mosaicolabs.examples --help
          uv run --isolated --no-project --with "${wheels[0]}[cli]" mosaicolabs.ros_injector --help

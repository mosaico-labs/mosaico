name: mosaicod Release Container

on:
  push:
    tags:
      - 'v[0-9].*.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
      # `mosaicod` is the server, with no FFmpeg; `mosaicod-optimizer` the store optimizer, built
      # with the `video` feature and FFmpeg (see docker/dockerfiles/Dockerfile.mosaicod).
        image: [mosaicod, mosaicod-optimizer]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_slug: arm64
          - image: mosaicod
            target: server
          - image: mosaicod-optimizer
            target: optimizer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Only tags signed with the release key are released.
      - name: Verify release tag
        uses: ./.github/actions/verify-release-tag
        with:
          tag: ${{ github.ref_name }}
          public-key: ${{ vars.RELEASE_PUBLIC_KEY }}
          fetch: "true"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfiles/Dockerfile.mosaicod
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform_slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image: [mosaicod, mosaicod-optimizer]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # Tag with x.y.z (git tag vX.Y.Z)
            type=semver,pattern={{version}}

            # Tag with x.y
            type=semver,pattern={{major}}.{{minor}}

            # `latest` is added automatically for stable (non-prerelease)
            # semver tags (flavor: latest=auto)

      - name: Create manifest list and push
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Extract tags from the JSON output and prefix them with the image name
          TAGS=$(echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '.tags[] | "-t " + .')
          
          # Combine the tags and the digests into the final command
          docker buildx imagetools create $TAGS \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' $(ls /tmp/digests))

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}

name: Contributors

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read # to read CONTRIBUTORS.md from the target branch

jobs:
  check-contributor:
    name: "Check contributor"
    # Organization members and bots do not need to sign the CLA
    if: >-
      ${{
        !contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) &&
        github.event.pull_request.user.type != 'Bot'
      }}
    runs-on: ubuntu-latest
    steps:
      # Check out CONTRIBUTORS.md from the target branch, not from the PR,
      # so a PR cannot pass the check by adding its own author to the list
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: CONTRIBUTORS.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check that the author is in CONTRIBUTORS.md
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const pr = context.payload.pull_request

            // Collaborators and authors who already have a commit in the
            // repository have signed the CLA
            if (['COLLABORATOR', 'CONTRIBUTOR'].includes(pr.author_association)) {
              core.info(`@${pr.user.login} is already a ${pr.author_association.toLowerCase()}, nothing to check`)
              return
            }

            // GitHub usernames are case-insensitive, so we compare them in lowercase
            const author = pr.user.login.toLowerCase()

            // Each contributor is a line like `- @username`
            const contributors = fs.readFileSync('CONTRIBUTORS.md', 'utf8')
              .split('\n')
              .filter(line => line.startsWith('- @'))
              .map(line => line.slice(3).trim().toLowerCase())

            // Fail the check when the author is not in the list
            if (!contributors.includes(author)) {
              core.setFailed(
                `@${author} is not listed in CONTRIBUTORS.md. ` +
                'Please sign the CLA and ask a maintainer to add you, ' +
                'then re-run this check.'
              )
            }

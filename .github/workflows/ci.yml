name: Full Stack

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**.py"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "scripts/tests"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**.py"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "scripts/tests"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full-stack-tests:
    name: "Tests on (Py ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-24.04
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: mosaico-sdk-py/pyproject.toml
          resolution-strategy: lowest
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: mosaico-sdk-py/uv.lock

      - name: Integration Tests
        run: |
          ./scripts/tests --full-stack-all

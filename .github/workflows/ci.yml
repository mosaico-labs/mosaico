name: Full Stack

on:
  push:
    branches: ["main", "release/v*.*", "release/py/v*.*"]
    paths:
      - ".github/workflows/ci.yml"
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**.py"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "scripts/tests"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "mosaicod/.cargo/config.toml"
      - "**.rs"
      - "**.py"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "scripts/tests"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stack-tests:
    name: "Tests on (Py ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-24.04
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: mosaico-sdk-py/uv.lock

      - name: Integration Tests
        run: |
          ./scripts/tests --full-stack-all

name: Python SDK Release

# Builds the Python SDK wheel of a py/vX.Y.Z tag and attaches it to the GitHub
# release of that tag. The Release workflow dispatches it on the tag once the
# release is created; it also runs when a py/v* tag is pushed by hand, and
# then creates the release.

on:
  push:
    tags:
      - 'py/v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    name: Build and attach wheel
    if: startsWith(github.ref, 'refs/tags/py/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"

      - name: Build wheel
        run: uv build --wheel --out-dir dist mosaico-sdk-py

      # Keeps the text of an existing release
      - name: Attach wheel to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          make_latest: false

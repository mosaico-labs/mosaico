name: mosaicod Precompiled Binaries

on:
  push:
    tags:
      - 'v[0-9].*.*'
  # To re-run it by hand: "Use workflow from" the release tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: linux-amd64
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only tags signed with the release key are released.
      - name: Verify release tag
        uses: ./.github/actions/verify-release-tag
        with:
          tag: ${{ github.ref_name }}
          public-key: ${{ vars.RELEASE_PUBLIC_KEY }}
          fetch: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cross Binary
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-v1

      - name: Install Cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "mosaicod -> target"
          key: ${{ matrix.target }}

      # `cross` builds in a container that can't read the git history: the commit and the tag come
      # from the environment (see mosaicod/Cross.toml).
      - name: Build Binary
        env:
          GIT_HASH: ${{ github.sha }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          cd mosaicod
          ~/.cargo/bin/cross build --release --bin mosaicod --target ${{ matrix.target }}

      - name: Package and Checksum
        run: |
          # Tarball
          tar -czvf mosaicod-${{ matrix.arch }}.tar.gz -C mosaicod/target/${{ matrix.target }}/release mosaicod
          # Checksum
          sha256sum mosaicod-${{ matrix.arch }}.tar.gz > mosaicod-${{ matrix.arch }}.tar.gz.sha256

      # The next job attaches all the binaries to the GitHub Release.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mosaicod-${{ matrix.arch }}
          path: |
            mosaicod-${{ matrix.arch }}.tar.gz
            mosaicod-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  attach-binaries:
    name: Attach binaries to the GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # The binaries built by the previous job.
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mosaicod-*
          path: dist
          merge-multiple: true

      # The release is created by the "GitHub Release" workflow, started by the same tag.
      - name: Wait for the GitHub Release
        run: |
          for attempt in $(seq 30); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
            echo "Release $TAG not found yet (attempt $attempt/30), retrying in 20s"
            sleep 20
          done
          echo "::error::Release $TAG not found: run the GitHub Release workflow on the tag, then re-run this job."
          exit 1

      # Attach the binaries, replacing them if this workflow is re-run.
      - name: Attach binaries
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

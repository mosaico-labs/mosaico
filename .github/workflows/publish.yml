name: Publish release

# Publishes a release when its signed tag `vX.Y.Z` is pushed (by the Release workflow, or by hand
# for a security update). It runs in two phases, so a release is published only if every artifact
# could be built:
#   1. build: mosaicod binaries, Python SDK wheel and sdist (tested), docs, container images;
#   2. publish: container tags on GHCR, docs on the object store and, last, the GitHub release with
#      the notes, the wheel, the sdist and the binaries. These jobs only upload what phase 1 built.
# A security update of an older release keeps the `latest` container tag, the online docs and the
# latest GitHub release on the highest release.
# A failed publish job can be retried with "Re-run failed jobs", with the same artifacts.
#
# Requires the variable RELEASE_PUBLIC_KEY (see release.yml) and the secrets R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY for the docs.

on:
  push:
    tags:
      - 'v[0-9]+.*.*'
  # To re-run it by hand: "Use workflow from" the release tag.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      # Whether this is the highest release. A security update of an older release must not
      # replace the `latest` container tag, the online docs and the latest GitHub release.
      latest: ${{ steps.highest.outputs.tag == github.ref_name }}
    steps:
      # Every tag, to compare this release with the others.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only tags signed with the release key are released.
      - name: Verify release tag
        uses: ./.github/actions/verify-release-tag
        with:
          tag: ${{ github.ref_name }}
          public-key: ${{ vars.RELEASE_PUBLIC_KEY }}
          fetch: "true"

      # Versions of mosaicod and of the Python SDK.
      - name: Read versions
        id: versions
        run: |
          echo "version=$(yq -p toml -oy '.workspace.package.version' mosaicod/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "py_version=$(yq -p toml -oy '.project.version' mosaico-sdk-py/pyproject.toml)" >> "$GITHUB_OUTPUT"

      # mosaicod and the Python SDK must have the version of the tag. A security update tagged by
      # hand must bump both manifests first.
      - name: Fail on version mismatch
        if: >-
          format('v{0}', steps.versions.outputs.version) != github.ref_name ||
          format('v{0}', steps.versions.outputs.py_version) != github.ref_name
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.versions.outputs.version }}
          PY_VERSION: ${{ steps.versions.outputs.py_version }}
        run: |
          echo "::error::Tag $TAG, but mosaicod is $VERSION and the Python SDK is $PY_VERSION."
          exit 1

      # The highest release tag, compared with this one in the job outputs.
      - name: Find highest release
        id: highest
        run: |
          echo "tag=$(git tag --list 'v*' --sort=-version:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$')" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------------
  # Phase 1: build every artifact.
  # ------------------------------------------------------------------------------------------------

  binaries:
    name: Build mosaicod (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: linux-amd64
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cross Binary
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-v1

      - name: Install Cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "mosaicod -> target"
          key: ${{ matrix.target }}

      # `cross` builds in a container that can't read the git history: the commit and the tag come
      # from the environment (see mosaicod/Cross.toml).
      - name: Build binary
        env:
          GIT_HASH: ${{ github.sha }}
          GIT_TAG: ${{ github.ref_name }}
        working-directory: mosaicod
        run: ~/.cargo/bin/cross build --release --bin mosaicod --target ${{ matrix.target }}

      # Tarball and its checksum.
      - name: Package binary
        run: |
          tar -czvf mosaicod-${{ matrix.arch }}.tar.gz -C mosaicod/target/${{ matrix.target }}/release mosaicod
          sha256sum mosaicod-${{ matrix.arch }}.tar.gz > mosaicod-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mosaicod-${{ matrix.arch }}
          path: |
            mosaicod-${{ matrix.arch }}.tar.gz
            mosaicod-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  # Builds the wheel and sdist once and tests them (artifact `python-sdk-dist`).
  python-sdk:
    name: Python SDK
    needs: verify
    uses: ./.github/workflows/py-wheel.yml

  docs-main:
    name: Build docs (Docusaurus)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/main/package-lock.json

      - name: Install dependencies
        working-directory: docs/main
        run: npm ci

      - name: Build Docusaurus
        working-directory: docs/main
        run: npm run build

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-main
          path: docs/main/build
          if-no-files-found: error

  docs-py:
    name: Build docs (Python SDK)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: mosaico-sdk-py/pyproject.toml
          resolution-strategy: lowest
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: docs/py/uv.lock

      - name: Install dependencies
        working-directory: docs/py
        run: uv sync --locked

      - name: Build MkDocs
        working-directory: docs/py
        run: uv run --locked mkdocs build

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-py
          path: docs/py/site
          if-no-files-found: error

  # One image per platform, on native runners. The images are pushed to GHCR by digest only, with
  # no tag: nobody sees them until phase 2 tags the multi-platform image.
  container:
    name: Build container (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfiles/Dockerfile.mosaicod
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/mosaicod,push-by-digest=true,name-canonical=true,push=true
          # One cache per platform, or the two builds overwrite each other's cache.
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # The digest of the image, for phase 2.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------------
  # Phase 2: publish, only if every artifact was built. These jobs only upload.
  # ------------------------------------------------------------------------------------------------

  publish-container:
    name: Publish container
    needs: [verify, binaries, python-sdk, docs-main, docs-py, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags `X.Y.Z`, `X.Y` and, only for the highest release, `latest`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mosaicod
          flavor: latest=${{ needs.verify.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The multi-platform image from the digests of phase 1, with the release tags.
      - name: Create manifest list and push
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mosaicod
        run: |
          TAGS=$(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " $(ls digests))

      - name: Inspect image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/mosaicod
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # Only the docs of the highest release are online (see docs/main/docs/dev/release_cycle.md).
  publish-docs:
    name: Publish docs
    needs: [verify, binaries, python-sdk, docs-main, docs-py, container]
    if: needs.verify.outputs.latest == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Download docs (Docusaurus)
        uses: actions/download-artifact@v8
        with:
          name: docs-main
          path: docs-main

      - name: Download docs (Python SDK)
        uses: actions/download-artifact@v8
        with:
          name: docs-py
          path: docs-py

      # Replace the online docs: files that are no longer in the build are removed.
      - name: Upload docs (Docusaurus)
        run: aws s3 sync docs-main s3://mosaico-docs/latest --delete --endpoint-url "$ENDPOINT" --region auto

      - name: Upload docs (Python SDK)
        run: aws s3 sync docs-py s3://mosaico-docs/python-sdk --delete --endpoint-url "$ENDPOINT" --region auto

  # Last, so the release is announced only once the container and the docs are published. It also
  # runs when the docs are skipped (security update of an older release), never after a failure.
  github-release:
    name: Publish GitHub release
    needs: [verify, publish-container, publish-docs]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # to show the PR author of each change in the notes
    steps:
      # Full history and tags, to list the changes since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The previous release: the highest release tag before this one, empty for the first release.
      - name: Find previous release
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "tag=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -x -A1 "$TAG" | sed -n 2p)" >> "$GITHUB_OUTPUT"

      # Old releases were tagged on release branches, not on main, so the notes start from where
      # the history of the previous release meets this one.
      - name: Find release start
        id: start
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          TAG: ${{ github.ref_name }}
        run: echo "sha=$(git merge-base "$PREVIOUS" "$TAG")" >> "$GITHUB_OUTPUT"

      # Release notes from the commit messages, one section per component (see .github/cliff.toml).
      # The author of each change is the GitHub user of its PR, from the GitHub API. The first
      # release has every commit up to its tag.
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: .github/cliff.toml
          args: >-
            --tag ${{ github.ref_name }}
            ${{ steps.start.outputs.sha && format('{0}..{1}', steps.start.outputs.sha, github.ref_name) || github.ref_name }}
        env:
          OUTPUT: release-notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: mosaicod-*
          path: dist
          merge-multiple: true

      - name: Download Python SDK
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      # The release of the tag, with the notes, the binaries, the wheel and the sdist. Only the highest
      # release is marked as latest, which `releases/latest` download links point to.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: ${{ needs.verify.outputs.latest }}

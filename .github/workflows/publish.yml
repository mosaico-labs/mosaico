name: Publish release

# Publishes a release when its signed tag `vX.Y.Z` is pushed (by the Release workflow, or by hand
# for a security update). It runs in two phases, so a release is published only if every artifact
# could be built:
#   1. build: mosaicod binaries, Python SDK wheel and sdist (tested), docs, container images;
#   2. publish: container tags on GHCR, Python SDK on PyPI, docs on the object store and, last, the
#      GitHub release with the notes, the wheel, the sdist and the binaries. These jobs only upload
#      what phase 1 built.
# A security update of an older release keeps the `latest` container tag, the online docs and the
# latest GitHub release on the highest release.
# A failed publish job can be retried with "Re-run failed jobs", with the same artifacts.
# The Release workflow calls it in its dry run, on the commit to tag and before the tag exists: it
# builds every artifact and runs the publish jobs without publishing anything, so a failure shows up
# before the release is tagged. A dry run uploads nothing: the container images are built but not
# pushed, and the publish jobs only show what they would publish.
#
# Requires the variable RELEASE_PUBLIC_KEY (see release.yml) and the secrets R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY for the docs. PyPI needs no secret: the `mosaicolabs`
# project trusts this workflow (Trusted Publishing) when it runs in the `pypi` environment.

on:
  push:
    tags:
      - 'v[0-9]+.*.*'
  # To re-run it by hand: "Use workflow from" the release tag.
  workflow_dispatch:
  # Dry run from the Release workflow.
  workflow_call:
    inputs:
      tag:
        description: "Release tag, not created yet"
        type: string
        required: true
      dry_run:
        description: "Build and check everything without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      # Whether this is the highest release. A security update of an older release must not
      # replace the `latest` container tag, the online docs and the latest GitHub release.
      latest: ${{ steps.highest.outputs.tag == steps.tag.outputs.tag }}
      version: ${{ steps.versions.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Every tag, to compare this release with the others.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release tag: the pushed tag, or the tag of the dry run.
      - name: Read release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Only tags signed with the release key are released. In a dry run the tag does not exist
      # yet: the Release workflow has already verified it.
      - name: Verify release tag
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/verify-release-tag
        with:
          tag: ${{ steps.tag.outputs.tag }}
          public-key: ${{ vars.RELEASE_PUBLIC_KEY }}
          fetch: "true"

      # Versions of mosaicod and of the Python SDK.
      - name: Read versions
        id: versions
        run: |
          echo "version=$(yq -p toml -oy '.workspace.package.version' mosaicod/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "py_version=$(yq -p toml -oy '.project.version' mosaico-sdk-py/pyproject.toml)" >> "$GITHUB_OUTPUT"

      # mosaicod and the Python SDK must have the version of the tag. A security update tagged by
      # hand must bump both manifests first.
      - name: Fail on version mismatch
        if: >-
          format('v{0}', steps.versions.outputs.version) != steps.tag.outputs.tag ||
          format('v{0}', steps.versions.outputs.py_version) != steps.tag.outputs.tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.versions.outputs.version }}
          PY_VERSION: ${{ steps.versions.outputs.py_version }}
        run: |
          echo "::error::Tag $TAG, but mosaicod is $VERSION and the Python SDK is $PY_VERSION."
          exit 1

      # The highest release tag, compared with this one in the job outputs. The release tag is added
      # to the list because it does not exist yet in a dry run.
      - name: Find highest release
        id: highest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "tag=$({ git tag --list 'v*'; echo "$TAG"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -u -r -V | head -n1)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------------------------------------
  # Phase 1: build every artifact.
  # ------------------------------------------------------------------------------------------------

  binaries:
    name: Build mosaicod (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: linux-amd64
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cross Binary
        id: cache-cross
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-cross-v1

      - name: Install Cross
        if: steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "mosaicod -> target"
          key: ${{ matrix.target }}

      # `cross` builds in a container with only the `mosaicod` workspace: the commit and the tag come
      # from the environment, and the repo-root `proto/` folder is mounted (see mosaicod/Cross.toml).
      - name: Build binary
        env:
          GIT_HASH: ${{ github.sha }}
          GIT_TAG: ${{ needs.verify.outputs.tag }}
          MOSAICO_PROTO_DIR: ${{ github.workspace }}/proto
        working-directory: mosaicod
        run: ~/.cargo/bin/cross build --release --bin mosaicod --target ${{ matrix.target }}

      # Tarball and its checksum.
      - name: Package binary
        run: |
          tar -czvf mosaicod-${{ matrix.arch }}.tar.gz -C mosaicod/target/${{ matrix.target }}/release mosaicod
          sha256sum mosaicod-${{ matrix.arch }}.tar.gz > mosaicod-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mosaicod-${{ matrix.arch }}
          path: |
            mosaicod-${{ matrix.arch }}.tar.gz
            mosaicod-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  # Builds the wheel and sdist once and tests them (artifact `python-sdk-dist`).
  python-sdk:
    name: Python SDK
    needs: verify
    uses: ./.github/workflows/py-wheel.yml

  docs-main:
    name: Build docs (Docusaurus)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/main/package-lock.json

      - name: Install dependencies
        working-directory: docs/main
        run: npm ci

      - name: Build Docusaurus
        working-directory: docs/main
        run: npm run build

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-main
          path: docs/main/build
          if-no-files-found: error

  docs-py:
    name: Build docs (Python SDK)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: mosaico-sdk-py/pyproject.toml
          resolution-strategy: lowest
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: docs/py/uv.lock

      - name: Install dependencies
        working-directory: docs/py
        run: uv sync --locked

      - name: Build MkDocs
        working-directory: docs/py
        run: uv run --locked mkdocs build

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-py
          path: docs/py/site
          if-no-files-found: error

  # One image per platform, on native runners. The images are pushed to GHCR by digest only, with
  # no tag: nobody sees them until phase 2 tags the multi-platform image. A dry run only builds them.
  container:
    name: Build container (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dockerfiles/Dockerfile.mosaicod
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_TAG=${{ needs.verify.outputs.tag }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/mosaicod,push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          # One cache per platform, or the two builds overwrite each other's cache.
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      # The digest of the image, for phase 2.
      - name: Export digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------------
  # Phase 2: publish, only if every artifact was built. These jobs only upload. In a dry run they
  # check what they would publish instead.
  # ------------------------------------------------------------------------------------------------

  publish-container:
    name: Publish container
    needs: [verify, binaries, python-sdk, docs-main, docs-py, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        if: ${{ !inputs.dry_run }}
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@v4

      # Tags `X.Y.Z`, `X.Y` and, only for the highest release, `latest`. The version comes from the
      # release tag, which is not the ref of a dry run.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mosaicod
          flavor: latest=${{ needs.verify.outputs.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}

      # The multi-platform image from the digests of phase 1, with the release tags.
      - name: Create manifest list and push
        if: ${{ !inputs.dry_run }}
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/mosaicod
        run: |
          TAGS=$(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " $(ls digests))

      - name: Inspect image
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/mosaicod
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

      # In a dry run, show the tags that would be pushed in the run summary.
      - name: Job summary
        if: ${{ inputs.dry_run }}
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          {
            echo "### Container (dry run, not pushed)"
            echo ""
            jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

  # A PyPI release can never be replaced, so PyPI gets exactly the wheel and sdist tested in phase 1.
  # Security updates of older releases are published too: pip picks the highest version anyway.
  # Skipped in a dry run, since PyPI has no dry run: the files are tested in phase 1.
  publish-pypi:
    name: Publish Python SDK (PyPI)
    needs: [verify, binaries, python-sdk, docs-main, docs-py, container]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mosaicolabs/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # Trusted Publishing, no API token
    steps:
      - name: Download Python SDK
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      # Also uploads the attestations of the files. `skip-existing` lets "Re-run failed jobs" go
      # past the files that were already uploaded.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # Only the docs of the highest release are online (see docs/main/docs/dev/release_cycle.md).
  publish-docs:
    name: Publish docs
    needs: [verify, binaries, python-sdk, docs-main, docs-py, container]
    if: needs.verify.outputs.latest == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # A dry run only lists the changes.
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - name: Download docs (Docusaurus)
        uses: actions/download-artifact@v8
        with:
          name: docs-main
          path: docs-main

      - name: Download docs (Python SDK)
        uses: actions/download-artifact@v8
        with:
          name: docs-py
          path: docs-py

      # Replace the online docs: files that are no longer in the build are removed.
      - name: Upload docs (Docusaurus)
        run: aws s3 sync docs-main s3://mosaico-docs/latest --delete ${DRY_RUN:+"$DRY_RUN"} --endpoint-url "$ENDPOINT" --region auto

      - name: Upload docs (Python SDK)
        run: aws s3 sync docs-py s3://mosaico-docs/python-sdk --delete ${DRY_RUN:+"$DRY_RUN"} --endpoint-url "$ENDPOINT" --region auto

  # Last, so the release is announced only once the container, the Python SDK and the docs are
  # published. It also runs when the docs are skipped (security update of an older release), never
  # after a failure. A dry run generates the notes and collects the files without creating the
  # release.
  github-release:
    name: Publish GitHub release
    needs: [verify, publish-container, publish-pypi, publish-docs]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # to show the PR author of each change in the notes
    steps:
      # Full history and tags, to list the changes since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The released commit: the tag, or the commit to tag in a dry run.
      - name: Read release ref
        id: release
        env:
          REF: ${{ inputs.dry_run && github.sha || needs.verify.outputs.tag }}
        run: echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # The previous release: the highest release tag before this one, empty for the first release.
      # The release tag is added to the list because it does not exist yet in a dry run.
      - name: Find previous release
        id: previous
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          echo "tag=$({ git tag --list 'v*'; echo "$TAG"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -u -r -V | grep -x -A1 "$TAG" | sed -n 2p)" >> "$GITHUB_OUTPUT"

      # Old releases were tagged on release branches, not on main, so the notes start from where
      # the history of the previous release meets this one.
      - name: Find release start
        id: start
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.tag }}
          RELEASE: ${{ steps.release.outputs.ref }}
        run: echo "sha=$(git merge-base "$PREVIOUS" "$RELEASE")" >> "$GITHUB_OUTPUT"

      # Release notes from the commit messages, one section per component (see .github/cliff.toml).
      # The author of each change is the GitHub user of its PR, from the GitHub API. The first
      # release has every commit up to its tag.
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: .github/cliff.toml
          args: >-
            --tag ${{ needs.verify.outputs.tag }}
            ${{ steps.start.outputs.sha && format('{0}..{1}', steps.start.outputs.sha, steps.release.outputs.ref) || steps.release.outputs.ref }}
        env:
          OUTPUT: release-notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: mosaicod-*
          path: dist
          merge-multiple: true

      - name: Download Python SDK
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      # The release of the tag, with the notes, the binaries, the wheel and the sdist. Only the highest
      # release is marked as latest, which `releases/latest` download links point to.
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: ${{ needs.verify.outputs.latest }}

      # In a dry run, show the release that would be created in the run summary.
      - name: Job summary
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          {
            echo "### GitHub release $TAG (dry run, not created)"
            echo ""
            echo "Files:"
            echo ""
            for FILE in dist/*; do echo "- \`${FILE#dist/}\`"; done
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

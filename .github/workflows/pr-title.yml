name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read # to fetch the current PR title

jobs:
  validate-title:
    name: "Validate PR title"
    # Drafts cannot be merged, so the title is checked once the PR is ready for
    # review. Bots set their own titles and labels, so they are skipped
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            test
          # Each entry is a regex. Multiple scopes are comma separated: `feat(mosaicod, sdk-py):`
          scopes: |
            cli
            deps
            docker
            docs
            mosaicod
            sdk-.+
          requireScope: false
          subjectPattern: ^(?![A-Z]).+(?<!\.)$
          subjectPatternError: |
            The description "{subject}" in PR title "{title}" must start with a lowercase letter
            and must not end with a period.

      - name: Require scope for component changes
        if: ${{ contains(fromJSON('["feat", "fix", "refactor", "perf", "test"]'), steps.lint.outputs.type) }}
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
          requireScope: true

  add-labels:
    name: "Add labels from the title"
    # Labels are added only to valid titles. The job is also skipped when
    # `validate-title` is skipped, e.g. for drafts and bots
    needs: validate-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to add labels
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Labels for each type. `feat`, `fix` and `build` have no matching label
            const typeLabels = {
              docs: ['documentation'],
              refactor: ['refactoring'],
              perf: ['performance'],
              test: ['tests'],
              chore: ['chore'],
              ci: ['ci'],
            }

            // Labels for each scope, with the component and its language
            const scopeLabels = {
              'mosaicod': ['mosaicod', 'rust'],
              'sdk-py': ['sdk', 'python'],
              'sdk-rust': ['sdk', 'rust'],
              // The CLI is part of the Python SDK
              'cli': ['sdk', 'python'],
              'deps': ['dependencies'],
              'docs': ['documentation'],
            }

            // `validate-title` checked the title, so the match cannot fail.
            // E.g. `feat(mosaicod, sdk-py)!: add x` gives
            // `feat`, `mosaicod, sdk-py` and `!`
            const titlePattern = /^(?<type>\w+)(?:\((?<scopes>[^)]*)\))?(?<breaking>!)?:/
            const { type, scopes = '', breaking } = context.payload.pull_request.title
              .match(titlePattern).groups

            // Multiple scopes are comma separated
            const labelsFromScopes = scopes.split(',')
              .flatMap(scope => scopeLabels[scope.trim()] ?? [])

            // A set, so labels shared by several scopes are added once
            const labels = new Set([...(typeLabels[type] ?? []), ...labelsFromScopes])

            // `!` marks a breaking change
            if (breaking) labels.add('breaking')

            // Add the labels to the ones already on the PR, without removing any
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              })
            }

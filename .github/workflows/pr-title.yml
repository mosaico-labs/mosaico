name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: "Validate PR title"
    runs-on: ubuntu-24.04
    steps:
      - id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            chore
            ci
            build
          # Each entry is a regex. Multiple scopes are comma separated: `feat(mosaicod, sdk-py):`
          scopes: |
            mosaicod
            sdk-.+
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+(?<!\.)$
          subjectPatternError: |
            The description "{subject}" in PR title "{title}" must start with a lowercase letter
            and must not end with a period.

      - name: Require scope for component changes
        env:
          TYPE: ${{ steps.lint.outputs.type }}
          SCOPE: ${{ steps.lint.outputs.scope }}
        run: |
          case "$TYPE" in
            docs|ci|chore|build) exit 0 ;;
          esac
          if [ -z "$SCOPE" ]; then
            echo "::error::PR title of type \"$TYPE\" must have a scope, e.g. \"$TYPE(mosaicod): ...\" or \"$TYPE(sdk-py): ...\"."
            exit 1
          fi

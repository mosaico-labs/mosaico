name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read # to fetch the current PR title

jobs:
  validate-title:
    name: "Validate PR title"
    # Bots set their own titles and labels, so they are skipped
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            test
          # Each entry is a regex. Multiple scopes are comma separated: `feat(mosaicod, sdk-py):`
          scopes: |
            cli
            deps
            docker
            docs
            mosaicod
            sdk-.+
          requireScope: false
          subjectPattern: ^(?![A-Z]).+(?<!\.)$
          subjectPatternError: |
            The description "{subject}" in PR title "{title}" must start with a lowercase letter
            and must not end with a period.

      - name: Require scope for component changes
        if: ${{ contains(fromJSON('["feat", "fix", "refactor", "perf", "test"]'), steps.lint.outputs.type) }}
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
          requireScope: true

  update-labels:
    name: "Update labels from the title"
    # Runs only once `validate-title` succeeds, so it is skipped for invalid
    # titles and for bots
    needs: validate-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to add and remove labels
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Labels for each type. `feat`, `fix` and `build` have no matching label
            const typeLabels = {
              docs: ['documentation'],
              refactor: ['refactoring'],
              perf: ['performance'],
              test: ['tests'],
              chore: ['chore'],
              ci: ['ci'],
            }

            // Labels for each scope, with the component and its language
            const scopeLabels = {
              'mosaicod': ['mosaicod', 'rust'],
              'sdk-py': ['sdk', 'python'],
              'sdk-rust': ['sdk', 'rust'],
              // The CLI is part of the Python SDK
              'cli': ['sdk', 'python'],
              'deps': ['dependencies'],
              'docs': ['documentation'],
            }

            // Labels of a title, e.g. `feat(mosaicod, sdk-py)!: add x` gives
            // `mosaicod`, `rust`, `sdk`, `python` and `breaking`. The new title is
            // always valid, but the old one might be invalid, so it can give none
            function labelsFrom(title) {
              // Matches the prefix before the subject, e.g. `feat(mosaicod, sdk-py)!:`,
              // where the scopes and `!` are optional
              const titlePattern = /^(?<type>\w+)(?:\((?<scopes>[^)]*)\))?(?<breaking>!)?:/
              const match = title.match(titlePattern)

              if (!match) return new Set()

              // From `feat(mosaicod, sdk-py)!:`, `type` is `feat`, `scopes` is
              // `mosaicod, sdk-py` and `breaking` is `!`. A title without scopes
              // gets an empty `scopes`, so it adds no scope labels below
              const { type, scopes = '', breaking } = match.groups

              // Multiple scopes are comma separated
              const labelsFromScopes = scopes.split(',')
                .flatMap(scope => scopeLabels[scope.trim()] ?? [])

              // A set, so labels shared by several scopes are added once
              const labels = new Set([...(typeLabels[type] ?? []), ...labelsFromScopes])

              // `!` marks a breaking change
              if (breaking) labels.add('breaking')

              return labels
            }

            const pr = context.payload.pull_request
            const labels = labelsFrom(pr.title)

            // When the title is edited, remove the labels that only the old title
            // gave, e.g. `mosaicod` and `rust` when `ci(mosaicod):` becomes `ci:`.
            // Every other label is kept
            const oldTitle = context.payload.changes?.title?.from ?? ''
            const current = new Set(pr.labels.map(label => label.name))
            for (const label of labelsFrom(oldTitle)) {
              if (!labels.has(label) && current.has(label)) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name: label,
                })
              }
            }

            // Add the labels to the ones already on the PR
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [...labels],
              })
            }

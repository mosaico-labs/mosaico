name: mosaicod Precompiled Binaries

on:
  push:
    tags:
      - 'mosaicod/v[0-9]+.[0-9]+.[0-9]+'
      - 'mosaicod/v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: linux-amd64
          - target: aarch64-unknown-linux-musl
            arch: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Build Binary
        run: |
          cd mosaicod
          cross build --release --bin mosaicod --target ${{ matrix.target }}

      - name: Package Tarball
        run: |
          tar -czvf mosaicod-${{ matrix.arch }}.tar.gz -C mosaicod/target/${{ matrix.target }}/release mosaicod

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mosaicod-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

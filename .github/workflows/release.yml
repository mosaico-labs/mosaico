name: Release

# Releases mosaicod or the Python SDK from a release/vX.Y branch: moves the
# component from X.Y.Z-rc to X.Y.Z, tags that commit, then opens the next
# release candidate X.Y.(Z+1)-rc. It also creates the GitHub release of the
# tag, with the changelog generated by scripts/workflows/changelog.sh as its
# text. Run it from the Actions tab on release/vX.Y.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
# workflows that run on the new tag and on release/v* are dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        type: choice
        options: [mosaicod, python]
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release ${{ inputs.component }}"
    # Only from a release/vX.Y branch.
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      FLAG: ${{ inputs.component == 'mosaicod' && '--mosaicod' || '--py' }}
      TAG_PREFIX: ${{ inputs.component == 'mosaicod' && 'v' || 'py/v' }}
      NAME: ${{ inputs.component == 'mosaicod' && 'mosaicod' || 'Python SDK' }}
      # GITHUB_TOKEN is used by changelog.sh to read the authors, GH_TOKEN by gh.
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      # Example: on release/v0.8 mosaicod is on 0.8.1-rc. It is released as
      # 0.8.1 with the tag v0.8.1, and the branch moves to 0.8.2-rc.
      - name: Compute versions
        run: |
          X_Y="${GITHUB_REF_NAME#release/v}"
          CURRENT=$(./scripts/workflows/version.sh get "$FLAG")
          if [[ "$CURRENT" != "$X_Y".*-rc ]]; then
            echo "::error::$NAME is on $CURRENT, not on a $X_Y.Z-rc version."
            exit 1
          fi
          STABLE="${CURRENT%-rc}"
          {
            echo "STABLE=$STABLE"
            echo "NEXT=$X_Y.$(( ${STABLE##*.} + 1 ))-rc"
            echo "TAG=${TAG_PREFIX}${STABLE}"
          } >> "$GITHUB_ENV"

      # The changelog of the component since its previous release, without its
      # "## [0.8.1] - <date>" title. It runs before any commit, so HEAD is on
      # GitHub and the authors can be read from its API.
      - name: Generate release notes
        run: ./scripts/workflows/changelog.sh "$FLAG" | sed '1d' | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"

      # The release commit (0.8.1, tagged) and the next release candidate
      # (0.8.2-rc) are pushed together: if the tag already exists or the branch
      # moved in the meantime, the push is rejected and nothing is released.
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/workflows/version.sh set "$FLAG" "$STABLE"
          git commit --quiet -am "chore: release $NAME v$STABLE"
          git tag -a "$TAG" -m "$NAME v$STABLE"
          ./scripts/workflows/version.sh set "$FLAG" "$NEXT"
          git commit --quiet -am "chore: bump $NAME to $NEXT"
          git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$TAG"

      # Only the highest mosaicod version is the latest release: a patch of an
      # older branch or an SDK release never replaces it.
      - name: Check latest release
        id: latest
        run: |
          HIGHEST=$(git tag -l 'v[0-9]*' | sort -V | tail -n 1)
          echo "latest=$([[ "$TAG" == "$HIGHEST" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.NAME }} v${{ env.STABLE }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: ${{ steps.latest.outputs.latest }}

      # The push used GITHUB_TOKEN, so it triggered nothing: start the builds
      # explicitly. They attach their artifacts to the release created above.
      - name: Dispatch mosaicod builds
        if: inputs.component == 'mosaicod'
        run: |
          gh workflow run mosaicod-release-docker.yml --ref "$TAG"
          gh workflow run mosaicod-release-precompiled.yml --ref "$TAG"
          gh workflow run mosaicod-rc-docker.yml --ref "$GITHUB_REF_NAME"

      - name: Dispatch Python SDK build
        if: inputs.component == 'python'
        run: gh workflow run py-release.yml --ref "$TAG"

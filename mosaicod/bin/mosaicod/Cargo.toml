[package]
name = "mosaicod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mosaicod"

[features]
# Exports metrics, traces and optionally logs over OTLP, configured with the standard
# `OTEL_*` variables.
telemetry = ["mosaicod-commands/telemetry"]

[dependencies]
mosaicod-build = { workspace = true }
mosaicod-commands = { workspace = true }
mosaicod-config = { workspace = true }
mosaicod-core = { workspace = true }

clap = { workspace = true }

mimalloc = { workspace = true }

[package]
name = "mosaicod-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "mosaicod_hook"

[dependencies]
mosaicod-core = { workspace = true }
mosaicod-db = { workspace = true, features = ["postgres"] }
mosaicod-marshal = { workspace = true }

bytes = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
mosaicod-db = { workspace = true, features = ["postgres", "testing"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }

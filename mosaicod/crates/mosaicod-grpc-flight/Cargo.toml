[package]
name = "mosaicod-grpc-flight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "mosaicod_grpc_flight"

[features]
# Images read back from the videos of image sequences: needs FFmpeg. Without it, only the videos
# are read back, in segments of a second.
video = ["dep:mosaicod-image", "mosaicod-video/ffmpeg", "dep:tempfile"]

[dependencies]
mosaicod-config = { workspace = true }
mosaicod-grpc-common = { workspace = true }
mosaicod-core = { workspace = true }
mosaicod-marshal = { workspace = true }
mosaicod-rw = { workspace = true }
mosaicod-ext = { workspace = true }
mosaicod-db = { workspace = true }
mosaicod-facade = { workspace = true }
mosaicod-store = { workspace = true }
mosaicod-query = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
arrow-flight = { workspace = true }
arrow = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
datafusion = { workspace = true }
mosaicod-image = { workspace = true, optional = true }
mosaicod-video = { workspace = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
mosaicod-store = { workspace = true, features = ["testing"] }
mosaicod-db = { workspace = true, features = ["testing"] }

[package]
name = "mosaicod-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Exports the telemetry of the service commands over OTLP, see `start`.
telemetry = ["dep:mosaicod-telemetry", "mosaicod-grpc/telemetry"]

[dependencies]
mosaicod-config = { workspace = true }
mosaicod-core = { workspace = true }
mosaicod-db = { workspace = true, features = ["postgres"] }
mosaicod-store = { workspace = true }
mosaicod-facade = { workspace = true }
mosaicod-grpc = { workspace = true }
mosaicod-query = { workspace = true }
mosaicod-task = { workspace = true }
mosaicod-telemetry = { workspace = true, optional = true }

clap = { workspace = true }
tokio-util = { workspace = true }
dotenv = { workspace = true }
colored = { workspace = true }
signal-hook = { workspace = true }
if-addrs = { workspace = true }
tokio = { workspace = true }
iso8601 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
mosaicod-config = { workspace = true, features = ["testing"] }

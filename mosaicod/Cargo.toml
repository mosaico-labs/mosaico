[workspace]
members = ["crates/*", "bin/*", "tests/"]
resolver = "3"

[workspace.package]
version = "0.6.0-dev"
authors = ["Mosaico Labs <info@mosaico.dev>"]
homepage = "https://mosaico.dev"
repository = "https://github.com/mosaico-labs/mosaico"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
# Internal crates
mosaicod-build = { path = "crates/mosaicod-build" }
mosaicod-core = { path = "crates/mosaicod-core" }
mosaicod-db = { path = "crates/mosaicod-db" }
mosaicod-facade = { path = "crates/mosaicod-facade" }
mosaicod-ext = { path = "crates/mosaicod-ext" }
mosaicod-marshal = { path = "crates/mosaicod-marshal" }
mosaicod-query = { path = "crates/mosaicod-query" }
mosaicod-rw = { path = "crates/mosaicod-rw" }
mosaicod-grpc = { path = "crates/mosaicod-grpc" }
mosaicod-grpc-flight = { path = "crates/mosaicod-grpc-flight" }
mosaicod-grpc-common = { path = "crates/mosaicod-grpc-common" }
mosaicod-store = { path = "crates/mosaicod-store" }
mosaicod-task = { path = "crates/mosaicod-task" }

# Arrow stack dependencies
arrow = { version = "58.1.0", features = ["prettyprint", "ipc_compression"] }
arrow-cast = "58.1.0"
arrow-flight = "58.1.0"
arrow-schema = "58.1.0"
parquet = "58.1.0"
datafusion = { version = "54.0.0", default-features = false, features = ["compression", "parquet", "sql", "recursive_protection", "nested_expressions"] }
tonic = { version = "0.14.6", features = ["tls-ring", "gzip"] }
object_store = { version = "0.13.2", features = ["aws", "fs"] }

base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde"] }
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
dotenv = "0.15.0"
futures = "0.3.32"
if-addrs = "0.15.0"
log = "0.4.29"
mimalloc = { version = "0.1", default-features = false }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.4"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "macros",
    "runtime-tokio",
    "uuid",
    "json",
] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7" }
tokio-stream = { version = "0.1"}
url = "2.5.8"
uuid = { version = "1.23.2", features = [ "v4" ] }
ulid = "1.2.1"
crc32fast = "1.5.0"
iso8601 = "0.6.3"
semver = "1.0.28"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
regex = "1.12.4"

# Used for testing
filetime = "0.2.27"

# Used to implement middlewares in mosaicod-server crate 
tower = "0.5.3"
http = "1.4.0"

[profile.release]
strip = true    # Strip symbols from binary
panic = "abort" # Smaller binary, no unwinding

[profile.profiling]
inherits = "release"
strip = "none"
panic = "unwind"
debug = true

[profile.optimized]
inherits = "release"
lto = true           # Link-Time Optimization
codegen-units = 1    # Better optimization (slower compile)

[profile.docker]
inherits = "release"
lto = "thin"
opt-level = "s"

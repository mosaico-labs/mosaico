syntax = "proto3";

package mosaico.v1.flight;

import "mosaico/v1/time.proto";
import "mosaico/v1/core.proto";

// These messages are Arrow Flight `FlightDescriptor.cmd` and
// `Criteria.expression` payloads (commands) and
// `FlightInfo`/`FlightEndpoint.app_metadata` payloads, carried as raw
// protobuf binary.

// `FlightDescriptor.cmd` payload for the get_flight_info RPC.
message GetFlightInfoCmd {
  string locator = 1;
  time.TimestampRange timestamp_range = 2;
}

// `FlightDescriptor.cmd` payload for the get_schema RPC.
message GetSchemaCmd {
  string locator = 1;
}

// `FlightDescriptor.cmd` payload for the do_put RPC.
message DoPutCmd {
  string locator = 1;
  string topic_uuid = 2;
}

// Sort order of a list_flights listing. Ordering is always ascending.
enum SequenceOrder {
  SEQUENCE_ORDER_UNSPECIFIED = 0;
  SEQUENCE_ORDER_CREATED_AT = 1;
  SEQUENCE_ORDER_NAME = 2;
}

// `Criteria.expression` payload for the list_flights RPC.
message ListFlightsCmd {
  string locator = 1;
  optional SequenceOrder order_by = 2;
  uint32 limit = 3;
  SequenceCursor cursor = 4;
}

// Sort key of a sequence in a list_flights listing.
message SequenceCursor {
  oneof key {
    SequenceCursorCreatedAt created_at = 1;
    string name = 2;
  }
}

message SequenceCursorCreatedAt {
  int64 created_at_ns = 1;
  int32 sequence_id = 2;
}

// `Ticket.ticket` payload for a topic's do_get RPC.
message TicketTopic {
  string locator = 1;
  time.TimestampRange timestamp_range = 2;
}

// `FlightInfo.app_metadata` payload for a sequence in a list_flights listing.
message SequenceListItemAppMetadata {
  SequenceCursor cursor = 1;
}

// `FlightInfo.app_metadata` payload for a sequence.
message SessionAppMetadata {
  string locator = 1;
  int64 created_at_ns = 2;
  optional int64 completed_at_ns = 3;
  repeated string topics = 4;
  bool locked = 5;
}

message SequenceAppMetadata {
  int64 created_at_ns = 1;
  string locator = 2;
  repeated SessionAppMetadata sessions = 3;
  // Arbitrary user-supplied JSON metadata, as raw UTF-8 text.
  // Empty bytes means no metadata was set.
  bytes user_metadata = 4;
}

message TopicAppMetadataTimeWindow {
  time.TimestampRange interval = 1;
  uint64 row_count = 2;
}

message TopicAppMetadataDataInfo {
  // This interval must be completely specified (neither start or end can be omitted).
  time.TimestampRange interval = 1;
  uint64 total_row_count = 2;
  uint64 total_bytes = 3;
  uint64 total_chunks_count = 4;
}

// `FlightEndpoint.app_metadata` payload for a topic.
message TopicAppMetadata {
  int64 created_at_ns = 1;
  optional int64 completed_at_ns = 2;
  bool locked = 3;
  string locator = 4;
  string ontology_tag = 5;
  core.Format serialization_format = 6;
  // Arbitrary user-supplied JSON metadata, as raw UTF-8 text.
  // Empty bytes means no metadata was set.
  bytes user_metadata = 7;
  TopicAppMetadataDataInfo data_info = 8;
  TopicAppMetadataTimeWindow time_window_info = 9;
  string session_locator = 10;
}

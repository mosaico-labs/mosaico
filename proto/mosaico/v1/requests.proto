syntax = "proto3";

package mosaico.v1.requests;

import "mosaico/v1/core.proto";
import "mosaico/v1/time.proto";

// The `Action.body` on the do_action Arrow Flight RPC carries these messages
// as raw protobuf binary.

// Locates a single resource by name.
message ResourceLocator {
  string locator = 1;
}

message SessionUuid {
  string session_uuid = 1;
}

message NotificationCreate {
  string locator = 1;
  string notification_type = 2;
  string msg = 3;
}

message SequenceCreate {
  string locator = 1;
  // Arbitrary user-supplied JSON metadata, as raw UTF-8 text.
  // Empty bytes means no metadata was set.
  bytes user_metadata = 2;
}

message TopicCreate {
  string locator = 1;
  string session_uuid = 2;
  core.Format serialization_format = 3;
  string ontology_tag = 4;
  // Arbitrary user-supplied JSON metadata, as raw UTF-8 text.
  // Empty bytes means no metadata was set.
  bytes user_metadata = 5;
}

message TopicClusterizeParams {
  string locator = 1;
  uint64 clustering_dt_ns = 2;
  // Column -> filter-expression map with arbitrary user-supplied keys: no fixed schema.
  bytes ontology = 3;
  time.TimestampRange timestamp_range = 4;
}

message TopicFilterIntersect {
  repeated TopicClusterizeParams topics = 1;
  uint64 intersect_dt_ns = 2;
}

// The query filter DSL has an arbitrary, user-supplied shape with no fixed field set.
message Query {
  bytes query = 1;
}

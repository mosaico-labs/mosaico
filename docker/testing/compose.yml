name: "mosaico-testing"
services:
  mosaico-pg-testing:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mosaico
    ports:
      - "127.0.0.1:6543:5432"
    volumes:
      - mosaico-testing-pg-data:/var/lib/postgresql/data
    networks:
      - mosaico-pg-testing-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL instance with TLS enabled, using the self-signed certificate
  # shipped with the official image.
  mosaico-pg-tls-testing:
    image: postgres:16
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mosaico
    ports:
      - "127.0.0.1:6544:5432"
    volumes:
      - mosaico-testing-pg-tls-data:/var/lib/postgresql/data
    networks:
      - mosaico-pg-testing-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mosaico-testing-pg-data:
  mosaico-testing-pg-tls-data:

networks:
  mosaico-pg-testing-net:

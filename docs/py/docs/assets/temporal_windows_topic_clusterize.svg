<svg width="720" height="224" viewBox="0 0 720 224" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
  <title>clustering_dt_ns controls how many clusters one topic's matches form: a small gap threshold keeps nearby-but-distinct matches apart, a large one merges them.</title>

  <!-- Part A: clusterize() -->
  <text x="20" y="34" font-size="13" font-weight="600" letter-spacing="0.3" fill="rgba(255,255,255,0.55)">clusterize() &#8212; clustering_dt_ns controls how many clusters form</text>

  <line x1="170" y1="65" x2="680" y2="65" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="20" y="69" font-size="13" font-weight="600" fill="#e6e6e6">raw matches</text>
  <circle cx="190" cy="65" r="5" fill="hsl(12, 88%, 54%)"/>
  <circle cx="210" cy="65" r="5" fill="hsl(12, 88%, 54%)"/>
  <circle cx="230" cy="65" r="5" fill="hsl(12, 88%, 54%)"/>
  <circle cx="340" cy="65" r="5" fill="hsl(12, 88%, 54%)"/>
  <circle cx="360" cy="65" r="5" fill="hsl(12, 88%, 54%)"/>
  <circle cx="380" cy="65" r="5" fill="hsl(12, 88%, 54%)"/>

  <line x1="170" y1="108" x2="680" y2="108" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="20" y="112" font-size="13" font-weight="600" fill="#e6e6e6">dt = small</text>
  <rect x="182" y="100" width="56" height="16" rx="6" fill="hsl(12, 88%, 54%)"/>
  <rect x="332" y="100" width="56" height="16" rx="6" fill="hsl(12, 88%, 54%)"/>
  <line x1="182" y1="116" x2="182" y2="124" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <line x1="238" y1="116" x2="238" y2="124" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <line x1="182" y1="124" x2="238" y2="124" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <text x="210" y="140" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">cluster 0</text>
  <line x1="332" y1="116" x2="332" y2="124" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <line x1="388" y1="116" x2="388" y2="124" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <line x1="332" y1="124" x2="388" y2="124" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <text x="360" y="140" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">cluster 1</text>

  <line x1="170" y1="172" x2="680" y2="172" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="20" y="176" font-size="13" font-weight="600" fill="#e6e6e6">dt = large</text>
  <rect x="182" y="164" width="206" height="16" rx="6" fill="hsl(12, 88%, 54%)"/>
  <line x1="182" y1="180" x2="182" y2="188" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <line x1="388" y1="180" x2="388" y2="188" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <line x1="182" y1="188" x2="388" y2="188" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <text x="285" y="204" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">cluster 0 (merged)</text>
</svg>

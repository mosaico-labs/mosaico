<svg width="720" height="180" viewBox="0 230 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
  <title>intersect_dt_ns controls how far apart two topics' clusters can be and still count as correlated.</title>

  <!-- Part B: intersect() -->
  <text x="20" y="246" font-size="13" font-weight="600" letter-spacing="0.3" fill="rgba(255,255,255,0.55)">intersect() &#8212; intersect_dt_ns bridges near-miss windows across topics</text>

  <text x="255" y="266" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Topic A cluster</text>
  <text x="420" y="266" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Topic B cluster</text>
  <rect x="190" y="276" width="130" height="22" rx="6" fill="hsl(12, 88%, 54%)"/>
  <rect x="360" y="276" width="120" height="22" rx="6" fill="hsl(195, 76%, 43%)"/>
  <text x="340" y="291" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">gap</text>

  <text x="20" y="320" font-size="12" font-weight="600" fill="#e6e6e6">dt = 0</text>
  <line x1="320" y1="298" x2="320" y2="316" stroke="rgb(255,99,99)" stroke-opacity="0.85" stroke-width="1.5"/>
  <line x1="360" y1="298" x2="360" y2="316" stroke="rgb(255,99,99)" stroke-opacity="0.85" stroke-width="1.5"/>
  <line x1="320" y1="316" x2="360" y2="316" stroke="rgb(255,99,99)" stroke-opacity="0.85" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="340" y="332" font-size="11" fill="rgba(255,140,140,0.9)" text-anchor="middle">gap &gt; dt &#8594; not correlated</text>

  <text x="20" y="374" font-size="12" font-weight="600" fill="#e6e6e6">dt &#8805; 40</text>
  <line x1="320" y1="352" x2="320" y2="370" stroke="hsl(304, 54%, 48%)" stroke-width="1.5"/>
  <line x1="360" y1="352" x2="360" y2="370" stroke="hsl(304, 54%, 48%)" stroke-width="1.5"/>
  <line x1="320" y1="370" x2="360" y2="370" stroke="hsl(304, 54%, 48%)" stroke-width="1.5"/>
  <text x="340" y="386" font-size="11" fill="hsl(304, 54%, 68%)" text-anchor="middle">gap &#8804; dt &#8594; correlated</text>
</svg>

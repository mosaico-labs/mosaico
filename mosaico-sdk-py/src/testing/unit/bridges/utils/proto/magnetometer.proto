syntax = "proto3";

package mosaicolabs.testing.mcap;

import "common.proto";

message AxisReading {
  string axis = 1;
  double value = 2;
  bool saturated = 3;
}

message Magnetometer {
  Header header = 1;
  Vector3 magnetic_field = 2;
  repeated double magnetic_field_covariance = 3;
  float temperature_celsius = 4;
  int64 sensor_id = 5;
  bool saturated = 6;
  repeated string calibration_notes = 7;
  repeated AxisReading readings = 8;
  fixed32 hardware_revision = 9;
  sfixed64 raw_counter = 10;
}

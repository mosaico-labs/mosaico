[project]
name = "mosaicolabs"
version = "0.8.0-dev"
description = "Python SDK for Mosaico Data-Platform"
authors = [{ name = "Mosaico Labs", email = "info@mosaico.dev" }]
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "mosaicolabs",
    "mosaico-sdk",
    "data-platform",
    "physical-ai",
    "robotics",
    "ros",
]

requires-python = ">=3.10,<4"
dependencies = [
    "pyarrow>=22.0.0",
    "numpy>=2.0.0,<2.5.0",
    "pillow>=11.3.0,<13.0.0",
    "pandas>=2.3.3,<4.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "rich>=14.3.3,<16.0.0",
    "rosbags>=0.11.2,<0.12.0",
    "typing-extensions>=4.15.0,<5.0.0",
    "av>=17.0.0,<18.0.0",
    "click>=8.3.1,<9.0.0",
    "mcap-protobuf-support>=0.5.4,<0.6.0",
    "mcap>=1.4.0,<2.0.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.25.1,<0.28.0",
    "tomli>=2.0.0,<3.0.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.8,<0.17.0",
    "pre-commit>=4.5.1,<5.0.0",
]

[tool.uv]
required-version = ">=0.11.23"

[tool.uv.build-backend]
module-name = ["mosaicolabs", "mosaicolabs_cli"]

[tool.ruff]
line-length = 88
# protoc-generated code (own style, dynamic globals()-based class construction ruff
# can't trace) -- not meant to be linted/formatted by project rules.
exclude = ["**/utils/generated/*_pb2.py", "**/utils/generated/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["COM812", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true

# ROS 1/2 messages (sensor_msgs) are typically system packages, but for development/testing
# you might need a Python wrapper, e.g., rosidl_runtime_py or a specific wrapper
# for sensor_msgs if you can't rely on the user's sourced ROS environment.
# Since you're using rosbags, relying on its abilities to read ROS messages is the standard approach.

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
"mosaicolabs.ros_injector" = "mosaicolabs.bridges.ros.injector:ros_injector"
"mosaicolabs.mcap_injector" = "mosaicolabs.bridges.mcap.injector:mcap_injector"
"mosaicolabs.watchdog" = "mosaicolabs.watchdog.watchdog:main"
"mosaicolabs.examples" = "mosaicolabs.examples.cli:run_example_cli"
"mosaicolabs.testing" = "testing.testing:mosaico_testing"
"mosaico" = "mosaicolabs_cli.main:app"
